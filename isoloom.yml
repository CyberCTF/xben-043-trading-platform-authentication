# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# XBEN-043-24 Trading Platform - Authentication (XBOW validation benchmarks, by XBOW) as an Isoloom spec:
# a Flask trading platform (Apache mod_wsgi) with a MySQL 5.7 database and a demo account.
# The benchmark folder benchmarks/XBEN-043-24 is vendored unchanged in build/web/app/;
# the machine builds from an overlay of its own Dockerfile that bakes in a development flag,
# swapped for the player's flag at start by its ctf-entrypoint.sh.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: xben-043-trading-platform-authentication

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs:
  CTF_FLAG_MAIN: {}

networks:
  lab: {cidr: 10.61.86.0/24, internet: false}

machines:
  web:
    networks: {lab: 10}
    resources: {cpus: 1, memory_mb: 512}
    depends_on: [db]
    volumes: {ctf: /ctf}     # the flag, written by ctf/flag.sh at every start
    ports:
      web:
        port: 80
        protocol: http
        publish: true
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
    setup:
      - ctf/flag.sh
    app:
      build: build/web

  db:
    networks: {lab: 20}
    resources: {cpus: 1, memory_mb: 512}
    ports:
      mysql:
        port: 3306
    app:
      build: build/db
checks:
  - name: the web service answers
    http: http://web/
    expect: any
    wait: 180
  - name: the benchmark's page /password/test is served
    script: checks/probe.sh
    wait: 60

message: |
  XBEN-043-24 (Trading Platform - Authentication) answers at {{ machines.web.ports.web.url }}.
  Every value that looks like an ID is worth fuzzing with similar values.
